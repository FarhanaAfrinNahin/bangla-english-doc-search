<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bangla-English Document Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "Noto Sans Bengali", sans-serif;
      line-height: 1.6;
    }
    header {
      background: var(--accent);
      color: white;
      padding: 24px 16px;
      text-align: center;
    }
    header h1 { margin: 0 0 4px; font-size: 1.6rem; }
    header p { margin: 0; opacity: 0.9; }
    main {
      max-width: 860px;
      margin: 24px auto;
      padding: 0 16px;
      display: grid;
      gap: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .card h2 { margin-top: 0; font-size: 1.2rem; }
    .muted { color: var(--muted); }
    footer {
      text-align: center;
      color: var(--muted);
      padding: 24px 16px;
      font-size: 0.9rem;
    }

button {
  background: var(--accent);
  color: #fff;
  border: 0;
  border-radius: 8px;
  padding: 10px 16px;
  font: inherit;
  cursor: pointer;
}
button:hover { opacity: 0.9; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.danger { background: #dc2626; padding: 6px 12px; font-size: 0.85rem; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
#doc-list { list-style: none; padding: 0; margin: 16px 0 0; }
#doc-list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
#upload-status { margin-top: 12px; min-height: 1.5em; }
.ok { color: #15803d; }
.error { color: #b91c1c; }

#search-input {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font: inherit;
  margin-bottom: 12px;
}
#search-input:focus {
  outline: 2px solid var(--accent);
  border-color: var(--accent);
}
#search-results { margin-top: 16px; }
.result {
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
}
.result:last-child { border-bottom: 0; }
.result-meta {
  color: var(--muted);
  font-size: 0.9rem;
  margin-bottom: 8px;
}
.result-text { white-space: pre-wrap; }

.bn { font-family: "Noto Sans Bengali", sans-serif; line-height: 1.9; }
mark { background: #fef08a; border-radius: 3px; padding: 0 2px; }
.examples { margin-top: 12px; }
button.chip {
  background: #eef2ff;
  color: #3730a3;
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 0.85rem;
}
footer a { color: var(--accent); }
@media (max-width: 600px) {
  header h1 { font-size: 1.3rem; }
  .card { padding: 14px; }
}

.view-link {
  display: inline-block;
  margin-top: 10px;
  font-size: 0.9rem;
  color: var(--accent);
  text-decoration: none;
}
.view-link:hover {
  text-decoration: underline;
}
.filter {
  margin-top: 12px;
}

.filter summary {
  cursor: pointer;
  color: var(--accent);
}

#filter-list {
  display: grid;
  gap: 6px;
  margin-top: 8px;
}

#filter-list label {
  display: flex;
  gap: 8px;
  align-items: center;
  cursor: pointer;
}
  </style>
</head>
<body>
  <header>
    <h1>Bangla-English Document Search</h1>
    <p>Search your documents by meaning, in Bangla or English</p>
  </header>

  <main>
    <section class="card" id="search-section">
  <h2>Search your documents</h2>
  <input
    type="text"
    id="search-input"
    placeholder="Ask in English or বাংলা..."
  >
  <button id="search-btn">Search</button>
  <div id="search-status" class="muted"></div>
<details class="filter">
  <summary id="filter-summary">Search in: all documents</summary>
  <div id="filter-list"></div>
</details>
<div class="row examples">
  <span class="muted">Try:</span>
  <button type="button" class="chip" data-q="What causes global warming?">What causes global warming?</button>
  <button type="button" class="chip" data-q="history of Bengal">history of Bengal</button>
  <button type="button" class="chip" data-q="বাংলার ইতিহাস">বাংলার ইতিহাস</button>
  <button type="button" class="chip" data-q="Sundarbans mangrove forest">Sundarbans mangrove forest</button>
</div>

  <div id="search-results"></div>
</section>

  <section class="card" id="docs-section">
  <h2>Your documents</h2>
  <div class="row">
    <input type="file" id="file-input" accept=".pdf,.txt">
    <button id="upload-btn">Upload</button>
  </div>
  <p class="muted">PDF or TXT, up to 20 MB.</p>
  <div id="upload-status"></div>
  <ul id="doc-list"></ul>
</section>
  </main>

  
<footer>
  Built with FastAPI, sentence-transformers, and FAISS ·
  <a href="https://github.com/FarhanaAfrinNahin/bangla-english-doc-search" target="_blank" rel="noopener">View on GitHub</a>
</footer>


<script>
  const fileInput = document.getElementById("file-input");
  const uploadBtn = document.getElementById("upload-btn");
  const statusBox = document.getElementById("upload-status");
  const docList = document.getElementById("doc-list");
  
  const searchInput = document.getElementById("search-input");
  const searchBtn = document.getElementById("search-btn");
  const searchStatus = document.getElementById("search-status");
  const searchResults = document.getElementById("search-results");

  function hasBangla(text) {
    return /[\u0980-\u09FF]/.test(text);
  }

  function highlight(container, text, query) {
    const words = query.split(/\s+/).filter((w) => w.length > 2);

    if (words.length === 0) {
      container.textContent = text;
      return;
    }

    const escaped = words.map((w) =>
      w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")
    );
    const regex = new RegExp("(" + escaped.join("|") + ")", "gi");

    let last = 0;
    for (const match of text.matchAll(regex)) {
      container.append(document.createTextNode(text.slice(last, match.index)));

      const mark = document.createElement("mark");
      mark.textContent = match[0];
      container.append(mark);

      last = match.index + match[0].length;
    }

    container.append(document.createTextNode(text.slice(last)));
  }

 
async function performSearch() {
  const query = searchInput.value.trim();

  if (!query) {
    searchStatus.textContent = "Please enter a search question.";
    searchResults.innerHTML = "";
    return;
  }

  const chosen = selectedSources();
  const total = filterList.querySelectorAll("input").length;

  if (total > 0 && chosen.length === 0) {
    searchStatus.textContent = "Please tick at least one document.";
    searchResults.innerHTML = "";
    return;
  }

  const params = new URLSearchParams({
    q: query,
    top_k: "3"
  });

  if (chosen.length < total) {
    chosen.forEach((name) => params.append("source", name));
  }

  searchBtn.disabled = true;
  searchStatus.textContent = "Searching...";
  searchResults.innerHTML = "";

  try {
    const url = `/search?${params.toString()}`;
    const res = await fetch(url);
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.detail || "Search failed.");
    }

    if (data.results.length === 0) {
      searchStatus.textContent = "No matching passages found.";
      return;
    }

    searchStatus.textContent = `Found ${data.results.length} matching passages.`;

    for (const item of data.results) {
      const result = document.createElement("div");
      result.className = "result";

      const meta = document.createElement("div");
      meta.className = "result-meta";
      meta.textContent = `${item.source} · Page ${item.page} · Score ${item.score}`;

      const content = document.createElement("div");
      content.className = "result-text";

      if (hasBangla(item.text)) {
        content.classList.add("bn");
        content.lang = "bn";
      }

      highlight(content, item.text, query);

      const link = document.createElement("a");
      link.className = "view-link";
      link.textContent = "View page ↗";
      link.target = "_blank";
      link.rel = "noopener";
      link.href = "/files/" + encodeURIComponent(item.source) +
        (item.source.toLowerCase().endsWith(".pdf") ? "#page=" + item.page : "");

      result.append(meta, content, link);
      searchResults.appendChild(result);
    }
  } catch (err) {
    searchStatus.textContent = err.message || "Could not reach the server.";
  } finally {
    searchBtn.disabled = false;
  }
}


  searchBtn.addEventListener("click", performSearch);

  searchInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") performSearch();
  });

  document.querySelectorAll(".chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      searchInput.value = chip.dataset.q;
      performSearch();
    });
  });


  function showStatus(message, kind) {
    statusBox.textContent = message;
    statusBox.className = kind || "";
  }
const filterList = document.getElementById("filter-list");
const filterSummary = document.getElementById("filter-summary");

function selectedSources() {
  return [...filterList.querySelectorAll("input:checked")].map(
    (box) => box.value
  );
}

function updateFilterSummary() {
  const total = filterList.querySelectorAll("input").length;
  const chosen = selectedSources().length;

  filterSummary.textContent =
    chosen === total
      ? "Search in: all documents"
      : `Search in: ${chosen} of ${total} documents`;
}

function renderFilter(documents) {
  filterList.innerHTML = "";

  for (const doc of documents) {
    const label = document.createElement("label");
    const box = document.createElement("input");

    box.type = "checkbox";
    box.value = doc.filename;
    box.checked = true;
    box.addEventListener("change", updateFilterSummary);

    label.append(box, doc.filename);
    filterList.appendChild(label);
  }

  updateFilterSummary();
}
  async function loadDocuments() {
    const res = await fetch("/documents");
    const data = await res.json();
    renderFilter(data.documents);
    docList.innerHTML = "";
    if (data.documents.length === 0) {
      const li = document.createElement("li");
      li.textContent = "No documents yet. Upload one above.";
      li.className = "muted";
      docList.appendChild(li);
      return;
    }
    for (const doc of data.documents) {
      const li = document.createElement("li");
      const label = document.createElement("span");
      label.textContent = `${doc.filename} (${doc.chunks} chunks)`;
      const del = document.createElement("button");
      del.textContent = "Delete";
      del.className = "danger";
      del.addEventListener("click", () => deleteDocument(doc.filename));
      li.append(label, del);
      docList.appendChild(li);
    }
  }

  async function deleteDocument(name) {
    if (!confirm(`Delete "${name}"?`)) return;
    const res = await fetch("/documents/" + encodeURIComponent(name), { method: "DELETE" });
    if (res.ok) showStatus(`Deleted ${name}.`, "ok");
    else showStatus("Could not delete the document.", "error");
    loadDocuments();
  }

  uploadBtn.addEventListener("click", async () => {
    const file = fileInput.files[0];
    if (!file) {
      showStatus("Please choose a file first.", "error");
      return;
    }
    const form = new FormData();
    form.append("file", file);
    uploadBtn.disabled = true;
    showStatus("Uploading and indexing... big files can take a minute.");
    try {
      const res = await fetch("/upload", { method: "POST", body: form });
      const data = await res.json();
      if (res.ok) {
        showStatus(`Added ${data.filename}: ${data.pages} pages, ${data.chunks_added} chunks.`, "ok");
      } else {
        showStatus(data.detail || "Upload failed.", "error");
      }
    } catch (err) {
      showStatus("Could not reach the server.", "error");
    }
    uploadBtn.disabled = false;
    fileInput.value = "";
    loadDocuments();
  });

  loadDocuments();
</script>

</body>
</html>
